# Weekly update PRs: the pinned GitHub Actions (SHA + tag comment) and the npm
# packages (one grouped PR; Expo SDK upgrades still go through `npx expo install`).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
