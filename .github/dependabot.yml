# Weekly update PRs: the pinned GitHub Actions (SHA + tag comment) and the npm
# packages Expo does NOT manage (one grouped PR).
# Packages Expo pins per SDK (expo, expo-*, react, react-native, their native
# modules, TypeScript) are left alone: Dependabot doesn't know Expo's version
# map, so its bumps fail expo-doctor. They're kept current by the weekly
# expo-sdk-check workflow (`npx expo install --check`), updated together with
# `npx expo install --fix`, and SDK upgrades go through `npx expo install expo@<next> --fix`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "typescript"
      - dependency-name: "@types/react"
      - dependency-name: "@maplibre/maplibre-react-native"
