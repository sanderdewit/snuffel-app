# App Store screenshots (started by hand): builds the app for the simulator,
# runs it in screenshot mode on a 6.9" iPhone in Amsterdam, and stores the
# images as an artifact (later uploaded with the store texts by store.yml).
name: screenshots

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages, space separated"
        default: "nl en"
      platforms:
        description: "ios, android or both"
        default: "ios android"

permissions:
  contents: read

# The inputs reach scripts only through env, and are checked first.
env:
  LANGUAGES: ${{ inputs.languages }}

jobs:
  ios:
    if: contains(inputs.platforms, 'ios') || inputs.platforms == 'both'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check the inputs
        run: '[[ "$LANGUAGES" =~ ^[a-z\ ]+$ ]] || { echo "::error::languages: lowercase codes separated by spaces"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace Snuffel.xcworkspace -scheme Snuffel -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 20
      - name: Take the screenshots
        run: bash tools/screenshots.sh ios/build/Build/Products/Release-iphonesimulator/Snuffel.app screenshots $LANGUAGES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-ios
          path: screenshots
          retention-days: 90

  android:
    if: contains(inputs.platforms, 'android') || inputs.platforms == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the inputs
        run: '[[ "$LANGUAGES" =~ ^[a-z\ ]+$ ]] || { echo "::error::languages: lowercase codes separated by spaces"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Screenshot build (sample data; never published)
        working-directory: android
        env:
          EXPO_PUBLIC_SNUFFEL_DEMO: "1"
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Take the screenshots (16:9 phone, Amsterdam)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/screenshots-android.sh android/app/build/outputs/apk/release/app-release.apk screenshots-android $LANGUAGES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-android
          path: screenshots-android
          retention-days: 90
