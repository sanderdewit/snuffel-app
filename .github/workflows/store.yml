# Upload the App Store texts (fastlane/metadata) and the screenshots from a
# screenshots run to App Store Connect (started by hand). Never uploads a build;
# with build_number it attaches that TestFlight build and submits it for review.
name: store

on:
  workflow_dispatch:
    inputs:
      screenshots_run:
        description: "Run ID of a successful 'screenshots' run (empty = texts only)"
        default: ""
      app_version:
        description: "App Store version to fill, e.g. 1.0.1 (created when it doesn't exist yet)"
        required: true
      build_number:
        description: "Build to attach and submit for review, e.g. 17 (empty = texts only, no submission)"
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  deliver:
    runs-on: macos-latest
    environment: release        # main only, approval required; holds the App Store Connect key
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The input reaches scripts only through env, and is checked first.
      - name: Check the inputs
        env:
          RUN_ID: ${{ inputs.screenshots_run }}
        run: '[[ -z "$RUN_ID" || "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::screenshots_run must be a run ID (digits only)"; exit 1; }'
      - name: Screenshots from that run
        if: inputs.screenshots_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.screenshots_run }}
        # App language -> App Store locale from store/locales.json (nb -> no, de -> de-DE ...).
        # Languages without an App Store localisation (bg, et, is, lt, lv, mk, sq, sr) are
        # not uploaded; locales without images in that run keep the ones they have.
        run: |
          gh run download "$RUN_ID" -n screenshots-ios -D /tmp/shots
          python3 - <<'EOF'
          import glob, json, os, shutil
          missing = []
          for lang, l in sorted(json.load(open("store/locales.json"))["languages"].items()):
              shots = sorted(glob.glob(f"/tmp/shots/{lang}/*.png"))
              if not l["appStore"]:
                  print(f"{lang}: no App Store locale, not uploaded")
              elif not shots:
                  missing.append(f"{lang} ({l['appStore']})")
              else:
                  os.makedirs(f"fastlane/screenshots/{l['appStore']}", exist_ok=True)
                  for s in shots: shutil.copy(s, f"fastlane/screenshots/{l['appStore']}/")
                  print(f"{lang} -> {l['appStore']}: {len(shots)} images")
          if missing: print(f"::notice::not in that run, their screenshots stay as they are: {', '.join(missing)}")
          if not os.path.isdir("fastlane/screenshots"): print("::error::no screenshots for any App Store locale in that run"); raise SystemExit(1)
          EOF
          ls -R fastlane/screenshots
      - name: API key for fastlane
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'EOF'
          import base64, json, os
          key = base64.b64decode(os.environ["KEY_P8"]).decode()
          json.dump({"key_id": os.environ["KEY_ID"], "issuer_id": os.environ["ISSUER"], "key": key, "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc.json"), "w"))
          EOF
      - run: gem install fastlane --no-document
      - name: Upload texts and screenshots
        env:
          RUN_ID: ${{ inputs.screenshots_run }}
          APP_VERSION: ${{ inputs.app_version }}
          BUILD: ${{ inputs.build_number }}
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "::error::app_version must look like 1.0.1"; exit 1; }
          [[ -z "$BUILD" || "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build_number must be digits"; exit 1; }
          if [ -n "$RUN_ID" ]; then SHOTS=true SKIP=false; else SHOTS=false SKIP=true; fi
          # With a build: attach it and submit for review; released automatically once approved.
          SUBMIT=(--submit_for_review false)
          [ -n "$BUILD" ] && SUBMIT=(--build_number "$BUILD" --submit_for_review true --automatic_release true \
            --submission_information '{"add_id_info_uses_idfa": false, "export_compliance_uses_encryption": false}')
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier app.snuffel --app_version "$APP_VERSION" \
            --skip_binary_upload --skip_app_version_update false --force "${SUBMIT[@]}" \
            --overwrite_screenshots "$SHOTS" \
            --skip_screenshots "$SKIP" \
            --precheck_include_in_app_purchases false --run_precheck_before_submit false
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.json"
