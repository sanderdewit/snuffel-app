# Google Play store listing: the phone screenshots of a screenshots run, for every
# Play locale (started by hand). Per locale the existing phone screenshots are
# replaced (app language -> Play locale in store/locales.json, e.g. nb -> no-NO);
# the bundle, tracks, texts and other images stay as they are. Uses the Play
# Developer API with the service account (tools/play-listing.mjs, one edit).
name: play-listing

on:
  workflow_dispatch:
    inputs:
      screenshots_run:
        description: "Run ID of a successful 'screenshots' run with Android images"
        required: true
      languages:
        description: "App languages to update, space separated (all = every language in that run)"
        default: "all"

permissions:
  contents: read
  actions: read

# One Play edit at a time: the same group as release-android (a newer edit makes an
# open one fail on commit).
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    environment: release        # main only, approval required; holds PLAY_SERVICE_ACCOUNT_JSON
    timeout-minutes: 20
    steps:
      # The inputs reach scripts only through env, and are checked first.
      - name: Check the inputs
        env:
          RUN_ID: ${{ inputs.screenshots_run }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::screenshots_run must be a run ID (digits only)"; exit 1; }
          [[ "$LANGUAGES" =~ ^[a-z\ ]+$ ]] || { echo "::error::languages: lowercase codes separated by spaces, or all"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Screenshots from that run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.screenshots_run }}
        run: gh run download "$RUN_ID" -n screenshots-android -D "$RUNNER_TEMP/shots"
      - name: Check the images
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: node tools/play-listing.mjs "$RUNNER_TEMP/shots" --languages "$LANGUAGES" --dry-run
      - name: Replace the phone screenshots on Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          LANGUAGES: ${{ inputs.languages }}
        run: node tools/play-listing.mjs "$RUNNER_TEMP/shots" --languages "$LANGUAGES"
